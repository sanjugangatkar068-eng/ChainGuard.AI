# Tool configuration. Runtime dependencies live in backend/requirements.txt.

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["backend/.venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "database", "llm", "models", "seed", "signals"]

[tool.pytest.ini_options]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
